; Run python tools/project.py setup once, then open this root in PlatformIO.
[platformio]
default_envs = ember
src_dir = games/EmberHollow
boards_dir = ports/weact-f8u6/platform/boards
extra_configs = ports/weact-f8u6/environments.ini
[env]
platform = chgame-ember-repo-${PROJECT_HASH}=symlink://${PROJECT_DIR}/ports/weact-f8u6/platform
lib_extra_dirs = platform/board/arduino/CHGame/libraries
[env:ember]
extends = env:game
custom_chgame_sketch = ${PROJECT_DIR}/games/EmberHollow
[env:ember-debug]
extends = env:ember
build_type = debug
custom_chgame_usb = serial
build_flags = -DCHGAME_DEBUG=1

; Original CHGame console, CH32X035G8U6 / CX35.
[env:ember-rev0]
extends = env:ember
platform = chgame-ember-rev0-${PROJECT_HASH}=symlink://${PROJECT_DIR}/games/EmberHollow/tools/platformio/rev0
board = rev0

[env:ember-rev0-debug]
extends = env:ember-rev0
build_type = debug
custom_chgame_usb = serial
build_flags = -DCHGAME_DEBUG=1
