; Keep this folder at games/EmberHollow inside a CHGame checkout with the
; WeAct F8U6 variant. No core or library copies are embedded in the game.
[platformio]
default_envs = ember
src_dir = .
boards_dir = ../../ports/weact-f8u6/platform/boards
extra_configs = ../../ports/weact-f8u6/environments.ini

[env]
platform = chgame-ember-${PROJECT_HASH}=symlink://${PROJECT_DIR}/../../ports/weact-f8u6/platform
lib_extra_dirs = ../../platform/board/arduino/CHGame/libraries

[env:ember]
extends = env:game
custom_chgame_sketch = ${PROJECT_DIR}

[env:ember-debug]
extends = env:ember
build_type = debug
custom_chgame_usb = serial
build_flags = -DCHGAME_DEBUG=1

